<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="彭博社 · 创新点子王 —— 游戏、财经、娱乐新闻">

    <title>彭博社 · 创新点子王</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         顶部
    ========================== -->

    <header class="site-header">

        <div class="header-inner">

            <a href="index.html" class="logo">
                彭博社 · 创新点子王
            </a>

            <div class="header-right">

                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="搜索新闻..."
                    >

                    <button id="searchButton">
                        搜索
                    </button>
                </div>

            </div>

        </div>

    </header>


    <!-- =========================
         分类导航
    ========================== -->

    <nav class="category-nav">

        <div class="category-inner">

            <button
                class="category-button active"
                data-category="全部">
                全部
            </button>

            <button
                class="category-button"
                data-category="游戏">
                游戏
            </button>

            <button
                class="category-button"
                data-category="财经">
                财经
            </button>

            <button
                class="category-button"
                data-category="娱乐">
                娱乐
            </button>

        </div>

    </nav>


    <!-- =========================
         主内容
    ========================== -->

    <main class="main-container">

        <!-- 页面标题 -->

        <section class="page-heading">

            <div>
                <p class="small-heading">
                    LATEST NEWS
                </p>

                <h1 id="pageTitle">
                    最新资讯
                </h1>
            </div>

            <p class="news-count">
                共 <span id="newsCount">0</span> 条
            </p>

        </section>


        <!-- =========================
             新闻区域
        ========================== -->

        <section
            id="newsGrid"
            class="news-grid">

            <!-- JavaScript 会自动生成新闻 -->

        </section>


        <!-- 没有搜索结果 -->

        <div
            id="emptyMessage"
            class="empty-message">

            <h2>没有找到相关新闻</h2>

            <p>
                尝试更换关键词或者选择其他分类。
            </p>

        </div>

    </main>


    <!-- =========================
         页脚
    ========================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <div>
                <strong>彭博社 · 创新点子王</strong>
                <p>
                    游戏 · 财经 · 娱乐
                </p>
            </div>

            <div class="footer-copy">
                © 2026 Innovation Ideas
            </div>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
