<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="彭博社 · 创新点子王">

    <title>彭博社 · 创新点子王</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="site-header">

    <div class="header-inner">

        <a href="/" class="logo">
            彭博社 · 创新点子王
        </a>

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="搜索新闻..."
            >

            <button id="searchButton">
                搜索
            </button>

        </div>

    </div>

</header>



<nav class="category-nav">

    <div class="category-inner">

        <button
            class="category-button active"
            data-category="全部">

            全部

        </button>


        <button
            class="category-button"
            data-category="游戏">

            游戏

        </button>


        <button
            class="category-button"
            data-category="财经">

            财经

        </button>


        <button
            class="category-button"
            data-category="娱乐">

            娱乐

        </button>


        <button
            class="category-button"
            data-category="科技">

            科技

        </button>

    </div>

</nav>



<main class="main-container">


    <section class="page-heading">

        <div>

            <p class="small-heading">
                LATEST NEWS
            </p>

            <h1 id="pageTitle">
                最新资讯
            </h1>

        </div>


        <p class="news-count">

            共
            <span id="newsCount">0</span>
            条

        </p>

    </section>



    <section
        id="newsGrid"
        class="news-grid">

    </section>



    <div
        id="loading"
        class="loading">

        正在加载新闻...

    </div>



    <div
        id="emptyMessage"
        class="empty-message">

        <h2>
            没有找到相关新闻
        </h2>

        <p>
            尝试更换分类或者搜索关键词。
        </p>

    </div>



    <!-- =========================
         分页
    ========================== -->

    <nav
        id="pagination"
        class="pagination"
        aria-label="新闻分页">

    </nav>


</main>



<footer class="site-footer">

    <div class="footer-inner">

        <div>

            <strong>
                彭博社 · 创新点子王
            </strong>

            <p>
                游戏 · 财经 · 娱乐 · 科技
            </p>

        </div>


        <div class="footer-copy">

            © 2026 Innovation Ideas

        </div>

    </div>

</footer>


<script src="script.js"></script>

</body>

</html>
