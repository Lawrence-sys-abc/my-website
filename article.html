<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="彭博社 · 创新点子王"
    >

    <title>文章 - 彭博社 · 创新点子王</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #fff;
        }

        #loading {
            padding: 40px;
            text-align: center;
        }

        #article {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #articleFrame {
            display: block;
            width: 100%;
            min-height: 900px;
            border: 0;
            margin: 0;
            padding: 0;
            background: #fff;
        }

    </style>

</head>


<body>


    <div
        id="loading"
        class="loading"
    >
        正在加载文章...
    </div>


    <main
        id="article"
        style="display: none;"
    >

        <iframe
            id="articleFrame"
            title="文章内容"
        ></iframe>

    </main>


    <div
        id="errorMessage"
        class="empty-message"
        style="display: none;"
    >

        <h2>
            文章加载失败
        </h2>

        <p>
            这篇文章可能不存在。
        </p>

        <a href="/">
            返回首页
        </a>

    </div>


    <script
        type="module"
        src="article.js"
    ></script>


</body>

</html>
