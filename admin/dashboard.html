<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>管理后台 - Bloomberg New</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="admin-container">

        <div class="dashboard-box">

            <div class="dashboard-header">

                <div>
                    <h1>Bloomberg New</h1>
                    <p>文章管理后台</p>
                </div>

                <button id="logout-button">
                    退出登录
                </button>

            </div>


            <div class="dashboard-content">

                <h2>发布文章</h2>

                <form id="article-form">

                    <!-- 文章标题 -->
                    <div class="form-group">

                        <label for="title">
                            标题
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="请输入文章标题"
                            required
                        >

                    </div>


                    <!-- 文章分类 -->
                    <div class="form-group">

                        <label for="category">
                            分类
                        </label>

                        <select id="category" required>

                            <option value="">
                                请选择分类
                            </option>

                            <option value="游戏">
                                游戏
                            </option>

                            <option value="财经">
                                财经
                            </option>

                            <option value="娱乐">
                                娱乐
                            </option>

                        </select>

                    </div>


                    <!-- 完整 HTML -->
                    <div class="form-group">

                        <label for="content">
                            文章正文（完整 HTML）
                        </label>

                        <p style="
                            margin: 6px 0 10px;
                            color: #666;
                            font-size: 13px;
                            line-height: 1.6;
                        ">
                            直接复制你的 .html 文件中的全部代码，
                            从 &lt;!DOCTYPE html&gt; 到 &lt;/html&gt;，
                            然后粘贴到下面。
                        </p>

                        <textarea
                            id="content"
                            rows="30"
                            placeholder="<!DOCTYPE html>
<html lang=&quot;zh-CN&quot;>
<head>
    ...
</head>
<body>
    ...
</body>
</html>"
                            required
                        ></textarea>

                    </div>


                    <!-- 发布按钮 -->
                    <button
                        type="submit"
                        id="publish-button"
                    >
                        发布文章
                    </button>


                    <!-- 发布状态 -->
                    <p id="publish-message"></p>

                </form>

            </div>

        </div>

    </div>


    <script type="module" src="admin.js"></script>

</body>

</html>
