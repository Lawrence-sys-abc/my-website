<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>管理后台 - Bloomberg New</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>


<body>

<div class="admin-container">

    <div class="dashboard-box">

        <div class="dashboard-header">

            <div>
                <h1>Bloomberg New</h1>
                <p>文章管理后台</p>
            </div>

            <button id="logout-button">
                退出登录
            </button>

        </div>


        <div class="dashboard-content">

            <h2>发布文章</h2>


            <form id="article-form">


                <!-- ==========================
                     标题
                =========================== -->

                <div class="form-group">

                    <label for="title">
                        标题
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="请输入文章标题"
                        required
                    >

                </div>


                <!-- ==========================
                     分类
                =========================== -->

                <div class="form-group">

                    <label for="category">
                        分类
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            请选择分类
                        </option>

                        <option value="游戏">
                            游戏
                        </option>

                        <option value="财经">
                            财经
                        </option>

                        <option value="娱乐">
                            娱乐
                        </option>

                    </select>

                </div>


                <!-- ==========================
                     图片上传
                =========================== -->

                <div class="form-group">

                    <label>
                        文章图片
                    </label>

                    <p style="
                        margin:6px 0 10px;
                        color:#666;
                        font-size:13px;
                        line-height:1.6;
                    ">
                        按照 HTML 中的 IMAGE 编号上传图片。
                        例如 HTML 使用 {{IMAGE_1}}，
                        就上传到“图片 1”。
                    </p>


                    <div class="image-upload-item">

                        <label for="image_1">
                            图片 1
                        </label>

                        <input
                            type="file"
                            id="image_1"
                            accept="image/jpeg,image/png,image/webp"
                        >

                        <p
                            id="image_1_message"
                            class="image-message"
                        ></p>

                    </div>


                    <div class="image-upload-item">

                        <label for="image_2">
                            图片 2
                        </label>

                        <input
                            type="file"
                            id="image_2"
                            accept="image/jpeg,image/png,image/webp"
                        >

                        <p
                            id="image_2_message"
                            class="image-message"
                        ></p>

                    </div>


                    <div class="image-upload-item">

                        <label for="image_3">
                            图片 3
                        </label>

                        <input
                            type="file"
                            id="image_3"
                            accept="image/jpeg,image/png,image/webp"
                        >

                        <p
                            id="image_3_message"
                            class="image-message"
                        ></p>

                    </div>

                </div>


                <!-- ==========================
                     HTML正文
                =========================== -->

                <div class="form-group">

                    <label for="content">
                        文章正文（完整 HTML）
                    </label>


                    <p style="
                        margin:6px 0 10px;
                        color:#666;
                        font-size:13px;
                        line-height:1.6;
                    ">

                        直接粘贴完整 HTML。
                        图片位置请使用
                        {{IMAGE_1}}、
                        {{IMAGE_2}}、
                        {{IMAGE_3}}。

                    </p>


                    <textarea
                        id="content"
                        rows="30"
                        placeholder="<!DOCTYPE html>
<html>
<head>
...
</head>
<body>

<img src=&quot;{{IMAGE_1}}&quot;>

...

</body>
</html>"
                        required
                    ></textarea>

                </div>


                <!-- ==========================
                     发布
                =========================== -->

                <button
                    type="submit"
                    id="publish-button"
                >
                    发布文章
                </button>


                <p
                    id="publish-message"
                ></p>


            </form>

        </div>

    </div>

</div>


<script
    type="module"
    src="admin.js"
></script>

</body>

</html>
