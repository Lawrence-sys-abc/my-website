```html
<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>发布文章 - Bloomberg New</title>

    <link
        rel="stylesheet"
        href="/admin/admin.css"
    >

</head>

<body>

    <div class="dashboard-container">

        <!-- =========================
             顶部
        ========================== -->

        <header class="dashboard-header">

            <div>

                <h1>
                    Bloomberg New
                </h1>

                <p>
                    管理员发布后台
                </p>

            </div>

            <button
                type="button"
                id="logout-button"
                class="logout-button"
            >
                退出登录
            </button>

        </header>


        <!-- =========================
             发布区域
        ========================== -->

        <main class="publish-box">

            <h2>
                发布新文章
            </h2>


            <!-- 标题 -->

            <div class="form-group">

                <label for="title">
                    文章标题
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="请输入文章标题"
                    required
                >

            </div>


            <!-- 分类 -->

            <div class="form-group">

                <label for="category">
                    文章分类
                </label>

                <select id="category">

                    <option value="游戏">
                        游戏
                    </option>

                    <option value="财经">
                        财经
                    </option>

                    <option value="娱乐">
                        娱乐
                    </option>

                    <option value="科技">
                        科技
                    </option>

                </select>

            </div>


            <!-- =========================
                 图片上传
            ========================== -->

            <div class="form-group">

                <div class="section-title-row">

                    <label>
                        文章图片
                    </label>

                    <button
                        type="button"
                        id="add-image-button"
                        class="add-image-button"
                    >
                        + 添加图片
                    </button>

                </div>


                <p class="help-text">

                    需要几张图片就添加几个上传框。
                    不需要图片也可以直接发布。

                </p>


                <div id="image-upload-list">

                    <!-- JS 会自动创建图片上传框 -->

                </div>

            </div>


            <!-- =========================
                 HTML正文
            ========================== -->

            <div class="form-group">

                <label for="content">
                    HTML 文章内容
                </label>

                <p class="help-text">

                    这里直接粘贴纯 HTML。
                    图片位置使用
                    <code>{{IMAGE_1}}</code>、
                    <code>{{IMAGE_2}}</code>、
                    <code>{{IMAGE_3}}</code>
                    等占位符。

                </p>

                <textarea
                    id="content"
                    placeholder="在这里粘贴文章 HTML..."
                    required
                ></textarea>

            </div>


            <!-- =========================
                 发布按钮
            ========================== -->

            <button
                type="button"
                id="publish-button"
                class="publish-button"
            >
                发布文章
            </button>


            <p id="publish-message"></p>

        </main>

    </div>


    <script
        type="module"
        src="/admin/admin.js"
    ></script>

</body>

</html>
```
