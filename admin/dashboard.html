<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>管理后台 - Bloomberg New</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>

<div class="admin-container">

    <div class="dashboard-box">


        <!-- ==========================================
             顶部
        =========================================== -->

        <div class="dashboard-header">

            <div>

                <h1>
                    Bloomberg New
                </h1>

                <p>
                    文章管理后台
                </p>

            </div>


            <button
                type="button"
                id="logout-button"
            >
                退出登录
            </button>

        </div>


        <!-- ==========================================
             内容
        =========================================== -->

        <div class="dashboard-content">


            <h2>
                发布文章
            </h2>


            <form
                id="article-form"
            >


                <!-- ==================================
                     标题
                =================================== -->

                <div class="form-group">

                    <label for="title">
                        标题
                    </label>


                    <input
                        type="text"
                        id="title"
                        placeholder="请输入文章标题"
                        required
                    >

                </div>


                <!-- ==================================
                     分类
                =================================== -->

                <div class="form-group">

                    <label for="category">
                        分类
                    </label>


                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            请选择分类
                        </option>

                        <option value="游戏">
                            游戏
                        </option>

                        <option value="财经">
                            财经
                        </option>

                        <option value="娱乐">
                            娱乐
                        </option>

                    </select>

                </div>


                <!-- ==================================
                     图片上传
                =================================== -->

                <div class="form-group">


                    <label>
                        文章图片
                    </label>


                    <p class="help-text">

                        根据文章需要添加图片。
                        不需要图片时可以直接发布。

                        <br>

                        HTML 中使用
                        <strong>{{IMAGE_1}}</strong>、
                        <strong>{{IMAGE_2}}</strong>、
                        <strong>{{IMAGE_3}}</strong>
                        等占位符。

                        <br>

                        使用几个图片占位符，
                        就添加对应数量的图片。

                    </p>


                    <!-- 图片列表 -->

                    <div
                        id="image-upload-list"
                    ></div>


                    <!-- 添加图片 -->

                    <button
                        type="button"
                        id="add-image-button"
                        class="secondary-button"
                    >
                        + 添加图片
                    </button>


                </div>


                <!-- ==================================
                     HTML 正文
                =================================== -->

                <div class="form-group">


                    <label for="content">
                        文章正文（完整 HTML）
                    </label>


                    <p class="help-text">

                        直接粘贴完整 HTML。

                        <br>

                        图片请使用：

                        <strong>{{IMAGE_1}}</strong>

                        <br>

                        第二张图片：

                        <strong>{{IMAGE_2}}</strong>

                        <br>

                        第三张图片：

                        <strong>{{IMAGE_3}}</strong>

                        <br>

                        不需要图片的文章可以不使用图片占位符。

                    </p>


                    <textarea
                        id="content"
                        rows="30"
                        placeholder="<!DOCTYPE html>
<html lang=&quot;zh-CN&quot;>
<head>
    <meta charset=&quot;UTF-8&quot;>
    <title>文章标题</title>
</head>

<body>

    <h1>文章标题</h1>

    <p>文章正文……</p>

    <img src=&quot;{{IMAGE_1}}&quot;>

</body>
</html>"
                        required
                    ></textarea>


                </div>


                <!-- ==================================
                     发布按钮
                =================================== -->

                <button
                    type="submit"
                    id="publish-button"
                >
                    发布文章
                </button>


                <!-- ==================================
                     发布消息
                =================================== -->

                <p
                    id="publish-message"
                ></p>


            </form>


        </div>

    </div>

</div>


<script
    type="module"
    src="/admin/admin.js"
></script>


</body>

</html>
